[project]
name = "docs-policy-kit"
version = "0.1.0"
description = "Config-driven docs policy engine: derived-copy drift gates, allowlisted publication with secret-scanned gates, ruling guards, and a docs audit."
requires-python = ">=3.11"
dependencies = []  # stdlib only

[project.scripts]
docpol = "docpol.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["docpol"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W"]